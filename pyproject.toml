[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "justorm"
version = "1.0.0"
description = "A lightweight, schemaless SQL builder that mixes into native database cursors."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "justorm contributors" },
]
keywords = [
    "sql",
    "orm",
    "query-builder",
    "psycopg",
    "psycopg2",
    "pymysql",
    "sqlite",
    "pymssql",
    "oracledb",
    "postgresql",
    "mysql",
    "sqlite3",
    "sqlserver",
    "oracle",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []


[project.optional-dependencies]
psycopg = ["psycopg>=3.1"]
psycopg2 = ["psycopg2-binary>=2.9"]
pymysql = ["PyMySQL>=1.0"]
pymssql = ["pymssql>=2.2"]
oracledb = ["oracledb>=1.0"]
# sqlite3 is part of the standard library, no extra needed.
all = [
    "psycopg>=3.1",
    "psycopg2-binary>=2.9",
    "PyMySQL>=1.0",
    "pymssql>=2.2",
    "oracledb>=1.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.8",
]


[project.urls]
Homepage = "https://github.com/dainan13/justorm"
Source = "https://github.com/dainan13/justorm"
Issues = "https://github.com/dainan13/justorm/issues"


[tool.hatch.build.targets.wheel]
packages = ["src/justorm"]


[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/README.md",
    "/LICENSE",
]


[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "psycopg: tests that require a running PostgreSQL and psycopg (v3)",
    "psycopg2: tests that require a running PostgreSQL and psycopg2",
    "pymysql: tests that require a running MySQL and PyMySQL",
    "sqlite: tests that use the built-in sqlite3 module",
    "pymssql: tests that require the pymssql driver (SQL Server)",
    "oracledb: tests that require the python-oracledb driver (Oracle)",
]


[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py39"
exclude = [".git", ".venv", "build", "dist"]


[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long, handled by formatter
]


[tool.mypy]
python_version = "3.9"
files = ["src/justorm"]
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
show_error_codes = true


[[tool.mypy.overrides]]
# These drivers ship without full type stubs; relax the checks for our
# thin wrapper modules that only subclass them.
module = [
    "justorm.psycopg",
    "justorm.psycopg2",
    "justorm.pymysql",
    "justorm.sqlite",
    "justorm.pymssql",
    "justorm.oracledb",
]
ignore_errors = true


[tool.coverage.run]
source = ["src/justorm"]
branch = true


[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
